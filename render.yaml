services:
  - type: web
    name: ai-recruit-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: CORS_ORIGINS
        value: https://resume-analyzer-lyart-kappa.vercel.app
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: MAX_RESUMES_PER_REQUEST
        value: "50"
      - key: MAX_RESUMES_TOTAL
        value: "1000"
      - key: MAX_FILE_SIZE_MB
        value: "10"
